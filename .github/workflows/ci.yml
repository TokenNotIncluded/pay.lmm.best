name: Rust CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler openssl
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format working tree
        run: cargo fmt --all
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release
      - name: Local-only process smoke and memory sample
        run: python3 scripts/smoke.py --binary target/release/pay-lmm | tee smoke-report.json
      - name: Save formatted source and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-and-lock
          path: |
            Cargo.lock
            src/
            tests/
            build.rs
      - name: Save Linux binary and smoke report
        uses: actions/upload-artifact@v4
        with:
          name: pay-lmm-linux-amd64
          path: |
            target/release/pay-lmm
            smoke-report.json
  # Temporary initialization job; removed after final source formatting is committed.
  normalize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-and-lock
          path: .
      - name: Commit validated source formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src tests build.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: format validated integration tests'
            git push
          fi
