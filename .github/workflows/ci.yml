name: Rust CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler openssl
      - name: Read pinned toolchain
        id: rust
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native development build
        run: cargo build --locked --release
      - name: Local-only process smoke
        run: python3 scripts/smoke.py --binary target/release/pay-lmm | tee smoke-report.json
      - name: Check smoke results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('smoke-report.json').read_text())
          assert result['orders'] == result['verified_notifications'] == 64
          PY
      - name: Save development report (not a portable release binary)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-smoke
          if-no-files-found: error
          path: smoke-report.json
