[package]
name = "pay-lmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Payment gateway protocol aggregation only; no payment processing or funds custody"
repository = "https://github.com/TokenNotIncluded/pay.lmm.best"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
fs2 = "0.4"
hex = "0.4"
md-5 = "0.10"
pem = "3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spki = { version = "0.7", features = ["std"] }
subtle = "2.6"
tokio = { version = "1", features = ["rt", "net", "sync", "signal", "time", "macros"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
url = "2"
zeroize = "1"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
